name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9.]+' custom-installments-for-woocommerce.php)
          if [ "$TAG" != "$HEADER" ]; then
            echo "Tag $TAG does not match plugin header version $HEADER" >&2
            exit 1
          fi

      - name: Build zip
        run: git archive --format=zip --prefix=custom-installments-for-woocommerce/ -o custom-installments-for-woocommerce.zip HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" custom-installments-for-woocommerce.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" custom-installments-for-woocommerce.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
